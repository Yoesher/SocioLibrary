name: Stage macOS preview assets
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful macOS build run
        required: true
      tag:
        description: Existing draft release tag
        required: true
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Verify draft and build
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          test "$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json workflowName --jq .workflowName)" = 'Build macOS desktop previews'
      - name: Download both architecture artifacts
        run: |
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name SocioLibrary-macOS-arm64 --dir artifacts/arm64
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name SocioLibrary-macOS-x86_64 --dir artifacts/x86_64
          python - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          tag=os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+',tag)
          version=tag[1:]
          for arch in ('arm64','x86_64'):
              folder=Path('artifacts')/arch
              expected={f'SocioLibrary-{version}-macOS-{arch}.{ext}' for ext in ('zip',)}
              assert {p.name for p in folder.iterdir()} == expected|{f'SHA256SUMS-macOS-{arch}.txt'}
              lines=(folder/f'SHA256SUMS-macOS-{arch}.txt').read_text().splitlines()
              assert len(lines)==1
              checked=set()
              for line in lines:
                  digest,name=line.split('  ',1)
                  assert name in expected and name not in checked
                  assert hashlib.sha256((folder/name).read_bytes()).hexdigest()==digest
                  checked.add(name)
          PY
      - name: Upload verified files to draft
        run: gh release upload "$RELEASE_TAG" artifacts/arm64/* artifacts/x86_64/* --repo "$GITHUB_REPOSITORY" --clobber
