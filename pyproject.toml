[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sociolit"
version = "0.11.0"
description = "Local-first sociology literature library with Zotero and journal discovery"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.28,<1", "pypdf>=6.1,<7", "pypdfium2>=5.10,<6", "pillow>=11,<13", "fonttools>=4.60,<5", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "defusedxml>=0.7,<1", "filelock>=3.16,<4"]

[project.urls]
Homepage = "https://github.com/Yoesher/SocioLibrary"
Repository = "https://github.com/Yoesher/SocioLibrary"
Issues = "https://github.com/Yoesher/SocioLibrary/issues"

[project.optional-dependencies]
semantic = ["sentence-transformers>=5,<6"]
desktop = ["pywebview>=6,<7; sys_platform == 'win32'", "pyinstaller>=6.16,<7; sys_platform == 'win32'"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
sociolit = "sociolit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sociolit = ["static/*", "ocr.ps1", "update.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

